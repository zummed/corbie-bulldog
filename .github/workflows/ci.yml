name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run at a time for a branch. A run that has started finishes; of the
# pushes that arrive meanwhile, only the newest is run after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # mise.toml pins Go and holds the tasks, here as on a desk.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-

      - run: mise run check

      - run: mise run dist
