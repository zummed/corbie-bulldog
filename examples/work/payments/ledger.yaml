# The ledger reads the charges and refunds them. A refund waits for a yes.
agent: ledger
input: { said: string, context: string }
model: usual
system: You keep the ledger. Find charges, and refund what was charged wrongly. Never say a card or account number outside payments.
prompt: ${input.context}
tools_file: [../.bulldog/tools/talk/talk.yaml, ../.bulldog/tools/notes/notes.yaml]
ask: { machine: ../.bulldog/ask.yaml }
tools:
  charges:
    does: The charges of one customer, newest first
    args: { customer: string }
    job:
      script: ./tools/ledger.js
      input: { do: charges, customer: "${args.customer}" }
      allow: [net:ledger.example.com, "secret:LEDGER_KEY@net:ledger.example.com"]
  refund:
    does: Refund one charge, by its id
    args: { charge: string, why: string }
    job:
      script: ./tools/ledger.js
      input: { do: refund, charge: "${args.charge}", why: "${args.why}" }
      allow: [net:ledger.example.com, "secret:LEDGER_KEY@net:ledger.example.com"]
      approve: true
