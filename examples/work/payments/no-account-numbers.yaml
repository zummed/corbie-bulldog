# Payments' release check. It needs the screening service, with a key, so
# it is a definition, which may reach that host with that key and nothing
# else. Being named in release, it is a rule and not a worker.
flow: no-account-numbers
stages:
  check:
    job:
      script: ./no-account-numbers.js
      input: ${input}
      allow: [net:screen.example.com, "secret:SCREEN_KEY@net:screen.example.com"]
output: ${stages.check.output}
