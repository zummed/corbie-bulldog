# The Telegram bridge's out machine. It carries one thing to one chat: to
# a person directly when direct is true, as their chat with the bot. A
# question is sent for a reply, and a decision with a button for each
# choice. It ends with { sent }, naming every message it sent, or, when
# Telegram refuses it for good, { refused }. Bulldog gives the text, and
# each file's data, as a blob of the run's input.
flow: telegram-out
input: [settings, to, direct, text, files, answers, choices, ref]
stages:
  say:
    job:
      script: ./telegram.js
      input: { do: say, to: "${input.to}", text: "${input.text}", files: "${input.files}", answers: "${input.answers}", choices: "${input.choices}", ref: "${input.ref}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
output: ${stages.say.output}
