# Microsoft Entra ID's sign-in machine. Bulldog sends a person's browser
# to the directory to sign in, and it sends the browser back to the office
# with a code; this takes the code to the directory's token endpoint with
# the client's secret, the Corbie secret ENTRA_CLIENT_SECRET, which only
# this job holds, and the verifier of the challenge Bulldog sent. It ends
# with { identity }, the person's sign-in name in small letters, once the
# ID token answered is for this client, from the directory the settings
# name, not expired and carries the nonce Bulldog gave; or with
# { refused }, saying why.
flow: signin-entra
input:
  type: object
  required: [code, verifier, redirect, nonce, settings]
  properties:
    code: { type: string }
    verifier: { type: string }
    redirect: { type: string }
    nonce: { type: string }
    settings:
      type: object
      additionalProperties: false
      required: [tenant, client_id]
      properties:
        from: { type: string }
        tenant: { type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", description: "The directory's ID, the Directory (tenant) ID on the app's Overview page." }
        client_id: { type: string, minLength: 1, description: "The app's Application (client) ID, on its Overview page." }
        authorize: { type: string, default: "https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize", description: "The directory's authorization endpoint, where Bulldog sends the browser; {tenant} is the tenant setting." }
        scope: { type: string, default: "openid profile email", description: "What the directory is asked for: the ID token, with the person's sign-in name." }
        label: { type: string, default: Microsoft, description: "What the sign-in page calls it, as Sign in with Microsoft." }
stages:
  exchange:
    job:
      script: ./entra.js
      input: { code: "${input.code}", verifier: "${input.verifier}", redirect: "${input.redirect}", nonce: "${input.nonce}", client_id: "${input.settings.client_id}", tenant: "${input.settings.tenant}" }
      allow: [net:login.microsoftonline.com, "secret:ENTRA_CLIENT_SECRET@net:login.microsoftonline.com"]
      timeout: 30s
output: ${stages.exchange.output}
