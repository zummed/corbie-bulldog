# Telegram's in. Each job asks Telegram for what is new since the cursor,
# waiting up to 50 seconds at a time, for 4 minutes, and emits heard,
# { things, cursor }, for what it hears; the next job hears from where it
# ended. When a job fails, the chart rests 30 seconds. The bot's token is
# the Corbie secret TELEGRAM_TOKEN.
statechart: telegram-in
keep: 1d
input:
  type: object
  required: [settings, cursor]
  properties:
    settings:
      type: object
      additionalProperties: false
      properties:
        places: { type: object }
    cursor: {}
initial: hearing
states:
  hearing:
    job:
      script: ./telegram.js
      input: { do: hear, settings: "${input.settings}", cursor: "${states.hearing.output?.cursor ?? input.cursor}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
      timeout: 5m
    on: { done: hearing, failed: resting }
  resting:
    timers: { again: 30s }
    on: { again: hearing }
