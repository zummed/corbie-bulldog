# Telegram's out. It sends one message to a chat, or to a person directly
# in their chat with the bot, and gives { sent }, the id of its last
# message. With ref, the message has a button for each choice, or, with no
# choices, asks for a reply. It throws when Telegram refuses.
flow: telegram-out
input: { settings: map, to: string, direct: boolean, text: string, choices: any, ref: any, answers: any }
stages:
  say:
    job:
      script: ./telegram.js
      input: { do: say, to: "${input.to}", text: "${input.text}", choices: "${input.choices}", ref: "${input.ref}", answers: "${input.answers}" }
      allow: [net:api.telegram.org, "secret:TELEGRAM_TOKEN@net:api.telegram.org"]
output: ${stages.say.output}
