# Jira's in. Each job asks Jira once for the issues of the projects the
# places name that changed since the cursor, and emits heard, { things,
# cursor }, for each new issue and comment. Then the chart rests 30
# seconds, since Jira cannot be asked to wait, and asks again; it rests the
# same after a job that fails. It speaks to the Jira at the settings' site,
# as example.atlassian.net, and signs in as the settings' email with the
# API token that is the Corbie secret JIRA_TOKEN.
statechart: jira-in
keep: 1d
input:
  type: object
  required: [settings, cursor]
  properties:
    settings:
      type: object
      required: [site, email]
      additionalProperties: false
      properties:
        site: { type: string }
        email: { type: string }
        places: { type: object }
    cursor: {}
initial: hearing
states:
  hearing:
    job:
      script: ./jira.js
      input: { do: hear, settings: "${input.settings}", cursor: "${states.hearing.output?.cursor ?? input.cursor}" }
      allow: ["net:${input.settings.site}", "secret:JIRA_TOKEN@net:${input.settings.site}"]
    on: { done: resting, failed: resting }
  resting:
    timers: { again: 30s }
    on: { again: hearing }
