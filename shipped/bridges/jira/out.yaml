# Jira's out. It answers in an issue, given by its key, with as many
# comments as the text takes, and gives { sent }, the id of its last
# comment; it throws when Jira refuses. Jira has no place to say anything
# to a person directly, so this takes no direct. It speaks to the Jira at
# the settings' site.
flow: jira-out
input: { settings: map, to: string, text: string }
stages:
  say:
    job:
      script: ./jira.js
      input: { do: say, settings: "${input.settings}", to: "${input.to}", text: "${input.text}" }
      allow: ["net:${input.settings.site}", "secret:JIRA_TOKEN@net:${input.settings.site}"]
output: ${stages.say.output}
