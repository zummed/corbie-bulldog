# The Slack bridge's in machine. It listens over Socket Mode: with the
# app's app-level token, the Corbie secret SLACK_APP_TOKEN, it asks Slack
# for a connection, and over it hears each event and each press of a
# button as Slack sends it, handing each over as it is heard and only then
# telling Slack it was received. It ends when Slack warns that it will
# close the connection, or after four minutes, well within its time limit,
# and Bulldog starts the next. With the app's bot token, SLACK_TOKEN, it
# reads a channel's name and who is in it, the files said there, and what
# the app last said in a person's conversation with it, which what they
# type there answers: the app needs the im:history scope for that, and a
# run without it fails, saying so. The job's allow list is what limits it:
# slack.com, files.slack.com and the hosts Slack's connections are made
# to, and nothing written or run.
flow: slack-in
input: { settings: any, cursor: any }
stages:
  hear:
    job:
      script: ./slack.js
      input: { do: hear, settings: "${input.settings}", cursor: "${input.cursor}" }
      allow: [net:slack.com, net:files.slack.com, net:wss-primary.slack.com, net:wss-backup.slack.com,
        "secret:SLACK_TOKEN@net:slack.com", "secret:SLACK_TOKEN@net:files.slack.com", "secret:SLACK_APP_TOKEN@net:slack.com"]
      timeout: 5m
output: ${stages.hear.output}
