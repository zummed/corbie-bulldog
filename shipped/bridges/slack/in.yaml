# Slack's in. Each job opens a Socket Mode connection with the app-level
# token, the Corbie secret SLACK_APP_TOKEN, and emits heard, { things,
# cursor }, for each message and each press of a button Slack sends, then
# tells Slack it was received. A job ends after 4 minutes, or when Slack
# closes the connection, and the next job connects again. When a job fails,
# the chart rests 30 seconds. With the bot token, SLACK_TOKEN, it reads a
# channel's name and the files said there. Slack keeps nothing to read
# back, so the cursor is always null.
statechart: slack-in
keep: 12h
input:
  type: object
  required: [settings, cursor]
  properties:
    settings:
      type: object
      additionalProperties: false
      properties:
        places: { type: object }
    cursor: {}
initial: hearing
states:
  hearing:
    job:
      script: ./slack.js
      input: { do: hear, settings: "${input.settings}" }
      allow: [net:slack.com, net:files.slack.com, net:wss-primary.slack.com, net:wss-backup.slack.com,
        "secret:SLACK_TOKEN@net:slack.com", "secret:SLACK_TOKEN@net:files.slack.com", "secret:SLACK_APP_TOKEN@net:slack.com"]
      timeout: 5m
    on: { done: hearing, failed: resting }
  resting:
    timers: { again: 30s }
    on: { again: hearing }
