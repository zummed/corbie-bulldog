# Slack's out. It sends one message to a thread, as channel/thread, or to
# a person directly in their conversation with the app, as Markdown, with
# a chart fence and an image alone on its line shown as Slack's own chart
# and image. With ref, the message has a button for each choice. It gives
# { sent }, the id of its last message, and throws when Slack refuses. The
# app's bot token is the Corbie secret SLACK_TOKEN.
flow: slack-out
input: { settings: map, to: string, direct: boolean, text: string, choices: any, ref: any }
stages:
  say:
    job:
      script: ./slack.js
      input: { do: say, to: "${input.to}", direct: "${input.direct}", text: "${input.text}", choices: "${input.choices}", ref: "${input.ref}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
output: ${stages.say.output}
