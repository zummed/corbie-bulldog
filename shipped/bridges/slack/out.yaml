# The Slack bridge's out machine. It carries one thing to one place: a
# thread, as channel/thread, or a person directly when direct is true, in
# their conversation with the app, as Markdown, which Slack shows. A
# decision is sent with a button for each choice; a file is named in it,
# not sent. It ends with { sent } or, when Slack refuses it for good,
# { refused }. Bulldog gives the text, and each file's data, as a blob of
# the run's input. The app's bot token is the Corbie secret SLACK_TOKEN.
flow: slack-out
input: [settings, to, direct, text, files, answers, choices, ref]
stages:
  say:
    job:
      script: ./slack.js
      input: { do: say, to: "${input.to}", direct: "${input.direct}", text: "${input.text}", files: "${input.files}", choices: "${input.choices}", ref: "${input.ref}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
output: ${stages.say.output}
