# The Slack bridge's out machine. It carries one thing to one place: a
# thread, as channel/thread, or a person directly when direct is true, in
# their conversation with the app, as Markdown, which Slack shows, with a
# chart fence and an image alone on its line shown as Slack's own chart
# and image. A decision, and a question that offers choices, is sent with
# a button for each choice; a file is named in it, not sent. Given
# working, it says nothing, and marks the message it answers with eyes
# while the team works on it, or takes the mark off. It ends with
# { sent } or, when Slack refuses it for good, { refused }. Bulldog gives
# the text, and each file's data, as a blob of the run's input. The app's
# bot token is the Corbie secret SLACK_TOKEN.
flow: slack-out
input: { settings: any, to: string, direct: boolean, text: blob, files: list, answers: any, choices: any, ref: any, working: "boolean?" }
stages:
  say:
    job:
      script: ./slack.js
      input: { do: say, to: "${input.to}", direct: "${input.direct}", text: "${input.text}", files: "${input.files}", answers: "${input.answers}",
        choices: "${input.choices}", ref: "${input.ref}", working: "${input.working}" }
      allow: [net:slack.com, "secret:SLACK_TOKEN@net:slack.com"]
output: ${stages.say.output}
