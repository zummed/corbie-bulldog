# GitLab's out. It answers in an issue or a merge request, given as
# project#iid or project!iid, with a comment, and gives { sent }, the id of
# its last comment; it throws when GitLab refuses. GitLab has no place to
# say anything to a person directly, so this takes no direct. It speaks to
# the GitLab at the settings' site.
flow: gitlab-out
input: { settings: map, to: string, text: string }
stages:
  say:
    job:
      script: ./gitlab.js
      input: { do: say, settings: "${input.settings}", to: "${input.to}", text: "${input.text}" }
      allow: ["net:${input.settings.site}", "secret:GITLAB_TOKEN@net:${input.settings.site}"]
output: ${stages.say.output}
