# GitLab's in. Each job asks GitLab once what happened on each project the
# places name since the cursor, and emits heard, { things, cursor }, when
# its cursor moves. Then the chart rests 30 seconds, since GitLab cannot be
# asked to wait, and asks again; it rests the same after a job that fails.
# It speaks to the GitLab at the settings' site, as gitlab.com, with the
# token that is the Corbie secret GITLAB_TOKEN.
statechart: gitlab-in
keep: 1d
input:
  type: object
  required: [settings, cursor]
  properties:
    settings:
      type: object
      required: [site]
      additionalProperties: false
      properties:
        site: { type: string }
        places: { type: object }
    cursor: {}
initial: hearing
states:
  hearing:
    job:
      script: ./gitlab.js
      input: { do: hear, settings: "${input.settings}", cursor: "${states.hearing.output?.cursor ?? input.cursor}" }
      allow: ["net:${input.settings.site}", "secret:GITLAB_TOKEN@net:${input.settings.site}"]
    on: { done: resting, failed: resting }
  resting:
    timers: { again: 30s }
    on: { again: hearing }
