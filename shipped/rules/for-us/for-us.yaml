# A heed rule that asks a fast model whether the message is for the team.
# It says yes at once, with no model, when mentioned.js does. Otherwise
# for-us.js asks a System One model at api.typesafe.ai, with the Corbie
# secret TYPESAFE_KEY. Past 10 seconds it says yes, whatever its script is
# doing.
statechart: for-us
input:
  type: object
  required: [request, said]
  properties:
    request: { type: object }
    said: { type: string }
initial: addressed
states:
  addressed:
    job: { script: ../mentioned/mentioned.js, input: { request: "${input.request}" } }
    on:
      done:
        - { go: said_yes, when: "${event.data.says == 'yes'}" }
        - asking
  asking:
    job:
      script: ./for-us.js
      input: { request: "${input.request}", said: "${input.said}" }
      allow: [net:api.typesafe.ai, "secret:TYPESAFE_KEY@net:api.typesafe.ai"]
    timers: { out: 10s }
    on: { done: weighed, out: timed_out }
  said_yes: { end: done, output: "${states.addressed.output}" }
  weighed: { end: done, output: "${states.asking.output}" }
  timed_out: { end: done, output: { says: "yes", note: "The model did not answer in time, so the message comes in." } }
