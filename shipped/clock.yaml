# The clock of a routine, given its time as due: a time of day, with or
# without a weekday, and a zone, as "mon 09:00 Europe/London". When its
# time comes it waits on its ticket, and once Bulldog answers that it
# waits for its time again.
statechart: clock
input: { due: string }
initial: waiting
states:
  waiting: { timers: { due: "${input.due}" }, on: { due: come } }
  come:    { ticket: came, on: { came: waiting } }
