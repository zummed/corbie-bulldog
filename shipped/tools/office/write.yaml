# The office tools Bulldog ships, to write: draft a change to the files of
# the worker's own team and of the teams within it, check it and put it.
# Each is a run that only waits: Bulldog does what was asked, and its
# answer is the tool's result. put_draft is marked approve, so Corbie
# holds it for a yes, and the worker started at the top names the ask
# Bulldog ships; a copy without approve writes the draft at once. A worker
# that drafts reads the office too, so it names this file beside read.yaml:
#   tools_file: [./.bulldog/tools/office/read.yaml, ./.bulldog/tools/office/write.yaml]
write_file:
  does: Put the whole new text of one file into your draft, making the file if it is not there. Nothing changes in the office until the draft is put
  args: { path: string, text: string }
  job:
    machine: ../../call.yaml
    input:
      tool: write_file
      args: "${args}"
      unanswered: &unanswered No answer came within 7 days. What you asked is still open, and an answer that comes later is said in the request, which starts your team again.
remove_file:
  does: Have your draft remove one file
  args: { path: string }
  job: { machine: ../../call.yaml, input: { tool: remove_file, args: "${args}", unanswered: *unanswered } }
check_draft:
  does: Read the office as your draft would make it. Gives every problem, as Corbie and Bulldog say it, and what the change does as whoever decides it will be told. Use it after writing, and mend what it says before you put the draft
  args: {}
  job: { machine: ../../call.yaml, input: { tool: check_draft, args: "${args}", unanswered: *unanswered } }
put_draft:
  does: Put your draft, to be written once it is decided. Say why in words a person can decide on, its first line saying what it is. Whoever decides is shown every file whole and what the change does
  args: { why: string }
  job: { machine: ../../call.yaml, input: { tool: put_draft, args: "${args}", unanswered: *unanswered }, approve: true }
