# The office tools Bulldog ships, to read: list, read and search the files
# of the worker's own team's folder and of the teams within it, and read
# the manual. Each is a run that only waits: Bulldog does what was asked,
# and its answer is the tool's result. A worker has them by naming this
# file:
#   tools_file: [./.bulldog/tools/office/read.yaml]
list_files:
  does: List every file you may read, your team's and those of the teams within it, and what your draft does to each, new, changed, removed or left as it is
  args: {}
  job:
    machine: ../../call.yaml
    input:
      tool: list_files
      args: "${args}"
      unanswered: &unanswered No answer came within 7 days. Ask again if it is still wanted.
read_file:
  does: Read one file of the office, as your draft has it, or as it is. The path is as list_files gives it, such as office.yaml or garden/gardener.yaml
  args: { path: string }
  job: { machine: ../../call.yaml, input: { tool: read_file, args: "${args}", unanswered: *unanswered } }
search_files:
  does: Find the lines of the files you may read that hold the words given, as written, in any case, each with its file and its line, as your draft has them, or as they are. Gives up to 20,000 characters
  args: { words: string }
  job: { machine: ../../call.yaml, input: { tool: search_files, args: "${args}", unanswered: *unanswered } }
manual:
  does: Read a page of the manual. The page office says how an office is written, with whole examples of a worker, a rule and a bridge; each thing Bulldog ships has a page named by its path, as tools/talk or bridges/slack; any other is a page of Corbie's manual. Leave page empty for the list of pages
  args: { page: "string?" }
  job: { machine: ../../call.yaml, input: { tool: manual, args: "${args}", unanswered: *unanswered } }
