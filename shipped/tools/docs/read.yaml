# The docs tools Bulldog ships, to read: list, read and search the docs of
# the team and of each team around it, out to the office. Each is a run
# that only waits: Bulldog does what was asked, and its answer is the
# tool's result. A worker has them by naming this file:
#   tools_file: [./.bulldog/tools/docs/read.yaml]
list_docs:
  does: List the docs you may read, your team's and those of each team around it, each with its name, its team, its size and its first heading. A doc of your own team stands before one of the same name further out
  args: {}
  job:
    machine: ../../call.yaml
    input:
      tool: list_docs
      args: "${args}"
      unanswered: &unanswered No answer came within 7 days. Ask again if it is still wanted.
read_doc:
  does: Read one doc by its name, as list_docs gives it, from a line on. Gives up to 20,000 characters, and where to read on
  args: { name: string, from: "number?" }
  job: { machine: ../../call.yaml, input: { tool: read_doc, args: "${args}", unanswered: *unanswered } }
search_docs:
  does: Find the lines of the docs you may read that hold the words given, as written, in any case, each with its doc, its line and its team. Gives up to 20,000 characters
  args: { words: string }
  job: { machine: ../../call.yaml, input: { tool: search_docs, args: "${args}", unanswered: *unanswered } }
