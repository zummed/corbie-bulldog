# The docs tools: read and write the team's docs, kept in Corbie's store
# under the place Bulldog gives a worker as input.request.docs. read_doc may
# only read, and write_doc may only write. write_doc is marked for
# approval, so the team's decide is shown the new text first.
read_doc:
  does: Read one of your team's docs by its name, or list their names when given none.
  args: { name: "string?" }
  job:
    script: ../../docs/docs.js
    input: { place: "${input.request.docs}", do: "${args.name ? 'read' : 'list'}", name: "${args.name ?? null}" }
    allow: ["kept.read:${input.request.docs}/**"]
write_doc:
  does: Write one of your team's docs, such as refunds.md, whole, once your team's deciders say yes to the new text.
  args: { name: string, text: string }
  job:
    script: ../../docs/docs.js
    input: { place: "${input.request.docs}", do: write, name: "${args.name}", text: "${args.text}" }
    allow: ["kept.write:${input.request.docs}/**"]
    approve: true
